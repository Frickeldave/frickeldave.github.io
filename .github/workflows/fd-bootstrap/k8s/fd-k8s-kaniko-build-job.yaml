# Vorlage für einen Ad-hoc-Kaniko-Build-Job.
#
# Wird von `.github/workflows/fd-bootstrap.yml` pro Image-Build gerendert und
# angewendet und im selben Workflow-Lauf wieder gelöscht. Die Platzhalter-
# Konvention ist wie bei allen Manifesten hier: Doppel-Unterstrich-Token werden
# unmittelbar vor `kubectl apply -f -` im Speicher ersetzt (per `sed`).
#
# Warum ein eigener Job statt des Executors im Runner-Pod:
# Kaniko entpackt das Basis-Image-Dateisystem direkt auf `/` seines eigenen
# Containers. Als Subprozess im langlebigen Runner-Container würde das (a)
# scheitern, weil der Runner als Nicht-root läuft und `/` nicht chown kann, und
# (b) das `/bin`, `/usr`, ... des Runners beschädigen, wenn es erlaubt wäre. Ein
# wegwerfbarer Pod pro Build gibt Kaniko das Wegwerf-Root-Dateisystem, für das
# es gebaut ist.
apiVersion: batch/v1
kind: Job
metadata:
  name: __JOB_NAME__
  namespace: __NAMESPACE__
  labels:
    app.kubernetes.io/name: kaniko-build
    app.kubernetes.io/part-of: fd-infra
spec:
  # Kein automatischer Retry: Ein fehlschlagender Build muss als fehlgeschlagener Workflow-Step sichtbar werden.
  backoffLimit: 0
  # Fertige Jobs bleiben lange genug zum Inspizieren nach einem fehlgeschlagenen
  # Workflow erhalten. Der Workflow löscht seine Jobs selbst; Fehlschläge bleiben
  # bis zum Ablauf dieser TTL, damit Pod-Logs und Status noch verfügbar sind.
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels:
        app.kubernetes.io/name: kaniko-build
        app.kubernetes.io/part-of: fd-infra
    spec:
      restartPolicy: Never
      # ghcr-pull-secret ist auch hier nötig: fd-dev-kaniko und das Eltern-Image
      # fd-dev-base sind private Pakete, ein anonymer Pull scheitert daher immer.
      # Dasselbe Secret enthält die GHCR-Credentials, mit denen Kaniko pusht.
      imagePullSecrets:
        - name: ghcr-pull-secret
      containers:
        - name: kaniko
          image: __KANIKO_IMAGE__
          imagePullPolicy: Always
          securityContext:
            # Bewusst root. Kaniko entpackt das Basis-Image auf das Root-
            # Dateisystem seines eigenen Containers und braucht uneingeschränktes chown /
            # Schreibrechte auf `/`. Das ist Prozess-Isolation in einem wegwerfbaren
            # Container, kein Host-root: kein privileged-Modus, keine zusätzlichen
            # Capabilities, kein hostPath/hostNetwork/hostPID, und der Pod wird direkt
            # nach dem Build gelöscht.
            runAsUser: 0
            runAsGroup: 0
            allowPrivilegeEscalation: false
            privileged: false
          # Den gepinnten Executor explizit aufrufen statt sich auf den
          # Image-Entrypoint zu verlassen.
          command:
            - /kaniko/executor
          # __EXTRA_BUILD_ARGS__ wird vom Workflow entfernt, wenn es ungenutzt ist.
          args:
            - --context=__GIT_CONTEXT__
            # Relativ zum Root des geklonten Git-Kontexts.
            - --dockerfile=__DOCKERFILE_PATH__
            - __DESTINATION_ARGS__
            - --build-arg=DEV_BASE_IMAGE=__DEV_BASE_IMAGE__
            - __EXTRA_BUILD_ARGS__
            # Layer-Cache. Ohne ihn baut jeder Lauf das apt-get-Layer von
            # docker-dev-full neu (~5 min). Der Cache liegt in einem eigenen GHCR-Paket
            # (geschrieben mit denselben Credentials wie das Image) und wird von Kaniko
            # pro Layer über den Content-Hash adressiert; eine geänderte Dockerfile-Zeile
            # oder eine geänderte COPY-Quelle baut weiterhin genau dieses Layer neu.
            # `--cache-copy-layers` ist bewusst NICHT gesetzt: Die COPY-Layer sind
            # wenige KB und in Millisekunden neu gebaut, während jedes gecachte Layer
            # einen weiteren Manifest-Push/Pull pro Lauf kosten würde.
            - --cache=true
            - --cache-repo=__CACHE_REPO__
            # Zwei Wochen (Kanikos Default), hier explizit, damit die Erneuerung des
            # langlebigen apt-Layers sichtbar und anpassbar ist.
            - --cache-ttl=336h
          env:
            # Registry-Credentials für Basis-Image-Pull und Push.
            - name: DOCKER_CONFIG
              value: /kaniko/.docker
            # Clone-Auth für den Git-Build-Kontext. Kanikos Git-Resolver nutzt die
            # Credentials als Benutzername/Passwort. Übergabe per Env (nicht in der
            # Kontext-URL), damit das Token nie in `kubectl get job -o yaml` oder in
            # Kubernetes-Event-Logs auftaucht.
            - name: GIT_USERNAME
              value: x-access-token
            - name: GIT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: __GIT_TOKEN_SECRET_NAME__
                  key: token
          resources:
            requests:
              cpu: 100m
              memory: 512Mi
            limits:
              cpu: 1000m
              # Höher als das Limit des Runner-Containers: Hier läuft kein Runner-Prozess,
              # und Image-Builds brauchen viel Speicher.
              memory: 4Gi
          volumeMounts:
            - name: ghcr-registry-config
              mountPath: /kaniko/.docker
              readOnly: true
      volumes:
        - name: ghcr-registry-config
          secret:
            secretName: ghcr-pull-secret
            defaultMode: 0440
            items:
              - key: .dockerconfigjson
                path: config.json
