name: fd-ci (Lint, Format, Vale, e2e checks)

on:
  # Einziges CI-Gate. Läuft bei Pull Requests gegen `dev`, bei Pushes auf `dev`
  # und manuell über den Actions-Tab. Die Deploy-Workflows hängen davon ab:
  # - fd-deploy-dev wartet auf einen erfolgreichen FD-CI-Push-Lauf auf `dev`.
  # - fd-deploy-prd dispatcht diesen Workflow und wartet auf seinen Erfolg.
  pull_request:
    branches:
      - dev
  push:
    branches:
      - dev
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint-checks:
    # Selbstgehosteter Runner (Label: fd) — 2 Replicas, siehe scripts/bootstrap/README.md
    # `npm ci` führt auch den `postinstall`-Hook aus, der Vale und OpenSCAD
    # in den Workspace holt; das Runner-Image bringt die nötigen Compiler mit.
    runs-on: [self-hosted, fd]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint:check

      - name: Format
        run: npm run format:check

      - name: Prose
        run: npm run prose

  scad-smoke-test:
    # Selbstgehosteter Runner (Label: fd) — 2 Replicas, siehe scripts/bootstrap/README.md
    # `install-openscad.mjs` entpackt das Linux-AppImage per
    # `--appimage-extract`, der Renderer läuft also ohne FUSE und ohne sudo.
    # Der STL-Export selbst ist headless: kein X-Server, kein xvfb.
    runs-on: [self-hosted, fd]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24

      - name: Install OpenSCAD
        run: node scripts/install-openscad.mjs --quiet

      - name: Run 3D smoke test
        run: node --test test/scad/scad-build.test.cjs

  e2e-test:
    # Selbstgehosteter Runner (Label: fd) — 2 Replicas, siehe scripts/bootstrap/README.md
    # Die Playwright-Browser sind im Runner-Image `fd-dev-base` enthalten
    # (`PLAYWRIGHT_BROWSERS_PATH=/opt/ms-playwright`, Chromium-Revision passt zu
    # `@playwright/test` 1.63.0), zur Job-Laufzeit wird also nichts geladen. Auch die
    # OS-Bibliotheken sind enthalten, und `appuser` hat kein sudo, eine
    # `--with-deps`-Installation ist weder nötig noch möglich.
    # Für diesen Job wurden die Runner-Limits erhöht: Der webServer-Build braucht
    # ~8 GiB und ~6 min bei 3 vCPU (Issue #282, Step 10).
    runs-on: [self-hosted, fd]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24

      - name: Install dependencies
        run: npm ci

      # `npm ci` installiert OpenSCAD bereits über `postinstall`; der explizite
      # Aufruf unten ist ein No-Op-Sicherheitsnetz, damit `npm run build` im Playwright-
      # webServer immer einen Renderer findet.
      - name: Install OpenSCAD
        run: node scripts/install-openscad.mjs --quiet

      - name: Run e2e tests
        run: npx playwright test
