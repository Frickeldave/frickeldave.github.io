name: fd-ci (Lint, Format, Vale, e2e checks)

on:
  # Single CI gate. Runs on pull requests targeting `dev`, on pushes to `dev`,
  # and manually from the Actions tab. The deploy workflows depend on this:
  #   - fd-deploy-dev listens for a successful FD CI push run on `dev`.
  #   - fd-deploy-prd dispatches this workflow and waits for its success.
  pull_request:
    branches:
      - dev
  push:
    branches:
      - dev
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint-checks:
    # Self-hosted runner (label: fd) — 2 replicas, see scripts/bootstrap/README.md
    # `npm ci` also runs the `postinstall` hook, which fetches Vale and OpenSCAD
    # into the workspace; the runner image carries the compilers those need.
    runs-on: [self-hosted, fd]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint:check

      - name: Format
        run: npm run format:check

      - name: Prose
        run: npm run prose

  scad-smoke-test:
    # Self-hosted runner (label: fd) — 2 replicas, see scripts/bootstrap/README.md
    # `install-openscad.mjs` unpacks the Linux AppImage via
    # `--appimage-extract`, so the renderer runs without FUSE and without sudo.
    # The STL export itself is headless: no X server or xvfb is involved.
    runs-on: [self-hosted, fd]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24

      - name: Install OpenSCAD
        run: node scripts/install-openscad.mjs --quiet

      - name: Run 3D smoke test
        run: node --test test/scad/scad-build.test.cjs

  e2e-test:
    # Self-hosted runner (label: fd) — 2 replicas, see scripts/bootstrap/README.md
    # The Playwright browsers are baked into the `fd-dev-base` runner image
    # (`PLAYWRIGHT_BROWSERS_PATH=/opt/ms-playwright`, chromium revision matches
    # `@playwright/test` 1.63.0), so nothing is downloaded at job time. The OS
    # libraries are baked in too and `appuser` has no sudo, so an
    # `--with-deps` install is neither needed nor possible.
    # The runner limits were raised for this job: the webServer build needs
    # ~8 GiB and ~6 min at 3 vCPU (issue #282, step 10).
    runs-on: [self-hosted, fd]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24

      - name: Install dependencies
        run: npm ci

      # `npm ci` already installs OpenSCAD via `postinstall`; the explicit call
      # below is a no-op safety net so `npm run build` inside the Playwright
      # webServer always finds a renderer.
      - name: Install OpenSCAD
        run: node scripts/install-openscad.mjs --quiet

      - name: Run e2e tests
        run: npx playwright test
