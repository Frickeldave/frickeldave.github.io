name: fd-podcast-update (Sync podcast episodes + deploy)

# Runner: self-hosted, label `fd` (see scripts/bootstrap/README.md) for BOTH jobs.
#
#   * `podcast-update` — the runner image (Ubuntu 24.04, non-root `appuser`, no
#     sudo) already carries Node 24, `git`, `gh` and `jq`, which is the entire
#     toolset this job uses. It therefore runs without `setup-node`, without
#     `npm ci` (the four scripts under scripts/workflows/podcast-update/ import
#     Node builtins only) and without nvm: the old `bash -il` login-shell
#     wrapper and the `nvm.sh` sourcing are gone, and the Node major version is
#     asserted against the runner instead of provisioned by it.
#   * `deploy-main` — same runners. `withastro/action` runs its own `npm ci` +
#     `astro build` (Node 24 via the `node-version` input, served by the nested
#     `actions/setup-node`), and `actions/deploy-pages` publishes the artifact.
#     A Pages deployment needs nothing but `pages`/`id-token` permissions, which
#     a self-hosted runner gets as well, so the `github-pages` environment stays.
#
# Third-party actions are pinned to full commit SHAs with a `# vN` comment, like
# fd-ci.yml and fd-configure.yml, so a re-pointed tag cannot change what runs on
# our own hardware. The actions nested *inside* `withastro/action`
# (setup-node, upload-pages-artifact) are referenced by that action's own file
# as tags; pinning the composite's SHA is the extent of control we have.
#
# Copilot CLI: `generate-metadata.mjs` shells out to `gh copilot`, which gh 2.102
# implements as a built-in command — it executes the Copilot CLI already on PATH
# (/usr/bin/copilot, v1.0.95 on the runner), so nothing is installed or
# downloaded at job time. Verified on the fd runner: `gh copilot -p` reaches the
# CLI, whose only remaining requirement is the GITHUB_TOKEN env var the step
# already sets from secrets.COPILOT_GITHUB_TOKEN.

on:
  schedule:
    # Every Tuesday at 09:00 CET/CEST
    - cron: "0 8 * * 2" # 08:00 UTC = 09:00 CET (winter) / 07:00 UTC = 09:00 CEST (summer)
  workflow_dispatch:
    inputs:
      target:
        description: "Target environment"
        required: true
        default: "dev"
        type: choice
        options:
          - dev
          - all
      dryRun:
        description: "Dry run (validate without committing)"
        required: false
        default: false
        type: boolean

permissions:
  contents: write
  actions: write
  pages: write
  id-token: write

jobs:
  podcast-update:
    runs-on: [self-hosted, fd]
    steps:
      - name: Checkout repository (main)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set git config
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      # The runner image provides Node 24 at /usr/bin/node, so nothing is
      # provisioned here — the major version is verified and the job fails hard
      # if the image ever drifts away from v24.
      - name: Check Node.js version
        run: |
          echo "🔍 Checking Node.js version..."
          NODE_VERSION=$(node --version)
          NODE_MAJOR=$(echo "$NODE_VERSION" | cut -d'v' -f2 | cut -d'.' -f1)
          if [ "$NODE_MAJOR" != "24" ]; then
            echo "❌ Node.js v24 is required, but $NODE_VERSION is installed."
            exit 1
          fi
          echo "✅ Node.js $NODE_VERSION is available"

      - name: Global episode comparison (against main)
        id: check_episodes
        run: |
          # Self-hosted workspaces persist between runs; the script appends to
          # $GITHUB_OUTPUT, so truncate the file first to keep a stale
          # `missing_episode` from a previous run out of this one.
          : > "$GITHUB_OUTPUT"
          echo "📡 Comparing RSS feed with main branch..."
          node scripts/workflows/podcast-update/compare-episodes.mjs
        env:
          GITHUB_OUTPUT: ${{ github.workspace }}/episode-check.txt

      - name: Exit if no new episodes
        if: steps.check_episodes.outputs.missing_episode == ''
        run: |
          echo "✅ No new episodes found. All episodes are up to date."
          exit 0

      # `gh copilot` is gh's built-in passthrough to the Copilot CLI that sits on
      # PATH (/usr/bin/copilot on the fd runner), so no gh extension is needed.
      # The script maps COPILOT_GITHUB_TOKEN onto GITHUB_TOKEN for the CLI.
      - name: Generate episode metadata using Copilot CLI
        if: steps.check_episodes.outputs.missing_episode != ''
        id: generate_metadata
        run: |
          echo "🤖 Generating episode metadata using GitHub Copilot CLI..."
          node scripts/workflows/podcast-update/generate-metadata.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.COPILOT_GITHUB_TOKEN }}

      - name: Update dev branch
        if: steps.check_episodes.outputs.missing_episode != ''
        id: update_dev
        run: |
          TITLE=$(jq -r '.title' metadata.json)
          echo "🌿 Updating dev branch with episode: $TITLE"

          git checkout dev
          git pull origin dev

          if [ "${{ github.event.inputs.dryRun }}" == "true" ]; then
            node scripts/workflows/podcast-update/update-doag.mjs --dry-run
            echo "🦁 DRY RUN: Skipping git commit and push."
          else
            node scripts/workflows/podcast-update/update-doag.mjs
            git add src/content/aboutme/doag.md
            git commit -m "feat(podcast): Add episode '$TITLE'" --no-verify
            git push origin dev
          fi

      - name: Trigger dev CI & deployment
        if: steps.update_dev.outcome == 'success' && steps.check_episodes.outputs.missing_episode != '' && github.event.inputs.dryRun != 'true'
        continue-on-error: true
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        with:
          script: |
            // Dispatch FD CI on dev; a successful run triggers fd-deploy-dev
            // (workflow_run) which then dispatches the HomeNet deployment.
            await github.rest.actions.createWorkflowDispatch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'fd-ci.yml',
              ref: 'dev'
            });
            console.log('✅ Dev CI & deployment chain triggered');

      - name: Update main branch
        if: steps.check_episodes.outputs.missing_episode != '' && (github.event.inputs.target == 'all' || github.event_name == 'schedule')
        id: update_main
        run: |
          TITLE=$(jq -r '.title' metadata.json)
          echo "🚀 Updating main branch with episode: $TITLE"

          git checkout main
          git pull origin main

          if [ "${{ github.event.inputs.dryRun }}" == "true" ]; then
            echo "🦁 DRY RUN: Would copy doag.md from dev (same ID as dev)."
          else
            # Copy doag.md directly from dev to avoid generating a new random ID
            git checkout dev -- src/content/aboutme/doag.md
            git add src/content/aboutme/doag.md
            git commit -m "feat(podcast): Add episode '$TITLE'" --no-verify
            git push origin main
          fi

      # NOTE: The previous "Trigger production deployment" step (which
      # dispatched the now-removed fd-release.yml) has been dropped. main is
      # now deployed to GitHub Pages by the `deploy-main` job below
      # (withastro/action@v3 build + actions/deploy-pages@v4) whenever this
      # workflow actually updates main. fd-deploy-prd remains available as a
      # standalone production deploy.

      - name: Success summary
        if: steps.check_episodes.outputs.missing_episode != ''
        run: |
          echo ""
          echo "╔════════════════════════════════════════════════════════════╗"
          echo "║  🎉 Independent Podcast Update Completed Successfully      ║"
          echo "╚════════════════════════════════════════════════════════════╝"
          echo ""
          echo "📊 Summary:"
          echo "  • Episode: $(jq -r '.title' metadata.json)"
          echo "  • Branches updated: dev ${{ (github.event.inputs.target == 'all' || github.event_name == 'schedule') && 'and main' || '' }}"
          echo ""
          echo "✅ Branches have been updated directly."

  deploy-main:
    needs: podcast-update
    if: (github.event.inputs.target == 'all' || github.event_name == 'schedule') && github.event.inputs.dryRun != 'true'
    # Self-hosted runner (label: fd), see the header. `withastro/action` does its
    # own install/build, so no npm or Node setup is needed here either.
    runs-on: [self-hosted, fd]
    environment: github-pages
    steps:
      # withastro/action does NOT check out the repository itself and looks for
      # the lockfile in the checked-out tree, so this step has to stay.
      - name: Checkout main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Build site
        uses: withastro/action@56781b97402ce0487b7e61ce2cb960c0e2cc5289 # v3
        with:
          node-version: 24
          path: .

      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
