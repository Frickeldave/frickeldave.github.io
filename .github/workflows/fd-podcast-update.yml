name: fd-podcast-update (Sync podcast episodes + deploy)

# Runner: selbstgehostet, Label `fd` (siehe scripts/bootstrap/README.md) für BEIDE Jobs.
#
# * `podcast-update` — das Runner-Image (Ubuntu 24.04, Nicht-root-`appuser`, kein
# sudo) bringt Node 24, `git`, `gh` und `jq` bereits mit, also das komplette
# Toolset dieses Jobs. Er läuft daher ohne `setup-node`, ohne
# `npm ci` (die vier Skripte unter scripts/workflows/podcast-update/ importieren nur
# Node-Builtins) und ohne nvm: Der alte `bash -il`-Login-Shell-Wrapper und das
# Sourcen von `nvm.sh` sind entfallen, und die Node-Major-Version wird gegen den
# Runner geprüft, statt von ihm bereitgestellt.
# * `deploy-main` — dieselben Runner. `withastro/action` führt sein eigenes `npm ci` +
# `astro build` aus (Node 24 über den `node-version`-Input, bereitgestellt vom
# verschachtelten `actions/setup-node`), und `actions/deploy-pages` veröffentlicht das Artifact.
# Ein Pages-Deployment braucht nur die Permissions `pages`/`id-token`, die ein
# selbstgehosteter Runner ebenfalls erhält, das `github-pages`-Environment bleibt also.
#
# Drittanbieter-Actions sind auf volle Commit-SHAs gepinnt, mit `# vN`-Kommentar, wie in
# fd-ci.yml und fd-configure.yml; ein umgehängter Tag kann also nicht ändern, was auf
# unserer eigenen Hardware läuft. Die *innerhalb* von `withastro/action` verschachtelten
# Actions (setup-node, upload-pages-artifact) referenziert die Datei dieser Action
# selbst per Tag; den SHA der Composite zu pinnen ist unsere Kontrollmöglichkeit.
#
# Copilot CLI: `generate-metadata.mjs` ruft `gh copilot` auf, was gh 2.102
# als eingebautes Kommando umsetzt — es startet die Copilot CLI, die bereits im PATH
# liegt (/usr/bin/copilot, v1.0.95 auf dem Runner); zur Job-Laufzeit wird also nichts
# installiert oder geladen. Auf dem fd-Runner geprüft: `gh copilot -p` erreicht die
# CLI, deren einzige verbleibende Voraussetzung die Env-Variable GITHUB_TOKEN ist, die der
# Step bereits aus secrets.COPILOT_GITHUB_TOKEN setzt.

on:
  schedule:
    # Jeden Dienstag um 09:00 CET/CEST
    - cron: "0 8 * * 2" # 08:00 UTC = 09:00 CET (winter) / 07:00 UTC = 09:00 CEST (summer)
  workflow_dispatch:
    inputs:
      target:
        description: "Target environment"
        required: true
        default: "dev"
        type: choice
        options:
          - dev
          - all
      dryRun:
        description: "Dry run (validate without committing)"
        required: false
        default: false
        type: boolean

permissions:
  contents: write
  actions: write
  pages: write
  id-token: write

jobs:
  podcast-update:
    runs-on: [self-hosted, fd]
    steps:
      - name: Checkout repository (main)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set git config
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      # Das Runner-Image stellt Node 24 unter /usr/bin/node bereit, es wird also nichts
      # bereitgestellt — die Major-Version wird geprüft, und der Job schlägt hart fehl,
      # falls das Image je von v24 abweicht.
      - name: Check Node.js version
        run: |
          echo "🔍 Checking Node.js version..."
          NODE_VERSION=$(node --version)
          NODE_MAJOR=$(echo "$NODE_VERSION" | cut -d'v' -f2 | cut -d'.' -f1)
          if [ "$NODE_MAJOR" != "24" ]; then
            echo "❌ Node.js v24 is required, but $NODE_VERSION is installed."
            exit 1
          fi
          echo "✅ Node.js $NODE_VERSION is available"

      - name: Global episode comparison (against main)
        id: check_episodes
        run: |
          # Selbstgehostete Workspaces bleiben zwischen Läufen bestehen; das Skript hängt an
          # $GITHUB_OUTPUT an, daher die Datei zuerst leeren, damit ein veraltetes
          # `missing_episode` aus einem früheren Lauf nicht hier hineinragt.
          : > "$GITHUB_OUTPUT"
          echo "📡 Comparing RSS feed with main branch..."
          node scripts/workflows/podcast-update/compare-episodes.mjs
        env:
          GITHUB_OUTPUT: ${{ github.workspace }}/episode-check.txt

      - name: Exit if no new episodes
        if: steps.check_episodes.outputs.missing_episode == ''
        run: |
          echo "✅ No new episodes found. All episodes are up to date."
          exit 0

      # `gh copilot` ist ghs eingebauter Durchgriff auf die Copilot CLI im
      # PATH (/usr/bin/copilot auf dem fd-Runner), eine gh-Extension ist also nicht nötig.
      # Das Skript bildet COPILOT_GITHUB_TOKEN für die CLI auf GITHUB_TOKEN ab.
      - name: Generate episode metadata using Copilot CLI
        if: steps.check_episodes.outputs.missing_episode != ''
        id: generate_metadata
        run: |
          echo "🤖 Generating episode metadata using GitHub Copilot CLI..."
          node scripts/workflows/podcast-update/generate-metadata.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.COPILOT_GITHUB_TOKEN }}

      - name: Update dev branch
        if: steps.check_episodes.outputs.missing_episode != ''
        id: update_dev
        run: |
          TITLE=$(jq -r '.title' metadata.json)
          echo "🌿 Updating dev branch with episode: $TITLE"

          git checkout dev
          git pull origin dev

          if [ "${{ github.event.inputs.dryRun }}" == "true" ]; then
            node scripts/workflows/podcast-update/update-doag.mjs --dry-run
            echo "🦁 DRY RUN: Skipping git commit and push."
          else
            node scripts/workflows/podcast-update/update-doag.mjs
            git add src/content/aboutme/doag.md
            git commit -m "feat(podcast): Add episode '$TITLE'" --no-verify
            git push origin dev
          fi

      - name: Trigger dev CI & deployment
        if: steps.update_dev.outcome == 'success' && steps.check_episodes.outputs.missing_episode != '' && github.event.inputs.dryRun != 'true'
        continue-on-error: true
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        with:
          script: |
            // Dispatch FD CI on dev; a successful run triggers fd-deploy-dev
            // (workflow_run) which then dispatches the HomeNet deployment.
            await github.rest.actions.createWorkflowDispatch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'fd-ci.yml',
              ref: 'dev'
            });
            console.log('✅ Dev CI & deployment chain triggered');

      - name: Update main branch
        if: steps.check_episodes.outputs.missing_episode != '' && (github.event.inputs.target == 'all' || github.event_name == 'schedule')
        id: update_main
        run: |
          TITLE=$(jq -r '.title' metadata.json)
          echo "🚀 Updating main branch with episode: $TITLE"

          git checkout main
          git pull origin main

          if [ "${{ github.event.inputs.dryRun }}" == "true" ]; then
            echo "🦁 DRY RUN: Would copy doag.md from dev (same ID as dev)."
          else
            # doag.md direkt aus dev kopieren, um keine neue Zufalls-ID zu erzeugen
            git checkout dev -- src/content/aboutme/doag.md
            git add src/content/aboutme/doag.md
            git commit -m "feat(podcast): Add episode '$TITLE'" --no-verify
            git push origin main
          fi

      # HINWEIS: Der frühere Step „Trigger production deployment" (der
      # das inzwischen entfernte fd-release.yml dispatchte) ist entfallen. `main` wird
      # jetzt vom `deploy-main`-Job unten nach GitHub Pages deployt
      # (withastro/action@v3-Build + actions/deploy-pages@v4), sobald dieser
      # Workflow `main` tatsächlich aktualisiert. fd-deploy-prd bleibt als
      # eigenständiger Produktions-Deploy verfügbar.

      - name: Success summary
        if: steps.check_episodes.outputs.missing_episode != ''
        run: |
          echo ""
          echo "╔════════════════════════════════════════════════════════════╗"
          echo "║  🎉 Independent Podcast Update Completed Successfully      ║"
          echo "╚════════════════════════════════════════════════════════════╝"
          echo ""
          echo "📊 Summary:"
          echo "  • Episode: $(jq -r '.title' metadata.json)"
          echo "  • Branches updated: dev ${{ (github.event.inputs.target == 'all' || github.event_name == 'schedule') && 'and main' || '' }}"
          echo ""
          echo "✅ Branches have been updated directly."

  deploy-main:
    needs: podcast-update
    if: (github.event.inputs.target == 'all' || github.event_name == 'schedule') && github.event.inputs.dryRun != 'true'
    # Selbstgehosteter Runner (Label: fd), siehe Kopf. `withastro/action` erledigt
    # Install und Build selbst, eine npm-/Node-Einrichtung ist also auch hier nicht nötig.
    runs-on: [self-hosted, fd]
    environment: github-pages
    steps:
      # withastro/action checkt das Repository nicht selbst aus und sucht die
      # Lockfile im ausgecheckten Baum, dieser Step muss daher bleiben.
      - name: Checkout main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Build site
        uses: withastro/action@56781b97402ce0487b7e61ce2cb960c0e2cc5289 # v3
        with:
          node-version: 24
          path: .

      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
