name: deploy-prd

on:
  # Run automatically after a successful "Squad Release" workflow completes,
  # or when manually dispatched from the Actions tab.
  workflow_run:
    workflows:
      - Squad Release
    types:
      - completed
  workflow_dispatch:

# Allow this job to clone the repo and create a page deployment
permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build-and-deploy:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: [self-hosted, frickeldave-main]
    
    environment:
      name: github-pages
      # The deploy step will populate this output; kept here for clarity
      url: ${{ steps.deployment.outputs.page_url }}

    steps:

      - name: Checkout your repository using git
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Fetch all history for tags

      - name: Install, build, and upload your site
        uses: withastro/action@v3
        with:
          path: . # The root location of your Astro project inside the repository. (optional)
          node-version: 24 # The specific version of Node that should be used to build your site. Defaults to 20. (optional)
          #package-manager: pnpm@latest # The Node package manager that should be used to install dependencies and build your site. Automatically detected based on your lockfile. (optional)

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
