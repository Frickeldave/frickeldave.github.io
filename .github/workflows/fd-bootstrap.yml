name: fd-bootstrap (Developer machines)

# Legt pro menschlichem Mitglied mit GitHub-Handle in .squad/team.md ein
# fd-dev-full-StatefulSet plus Service an (## Menschliche Mitglieder /
# ## Human Members) und löscht Maschinen nicht mehr gelisteter Mitglieder.
#
# Abweichung zur Vorlage: Die Maschine entsteht für jeden Developer/Techlead
# mit GitHub-Handle, auch ohne öffentlichen SSH-Schlüssel in
# ## Developer SSH Keys. Ohne Schlüssel läuft kein sshd und es entsteht keine
# authorized_keys; der Zugang ist dann nur `kubectl exec`. Mit Schlüssel
# lauscht sshd im Container auf Port 2222.
#
# Das Image fd-dev-full wird von einem wegwerfbaren Kaniko-Job gebaut (gleiches
# Muster wie die Vorlage), wenn sich sein Dockerfile-Verzeichnis oder ein
# gemeinsames Runtime-Skript ändert oder `build_image` gesetzt ist. Das
# Runner-Image bringt kubectl + crane mit, in fd-infra liegen die
# kaniko-builder-Role/RoleBinding und das Image fd-dev-kaniko für genau diesen Job.
#
# Laufende Maschinen werden nie automatisch neu gestartet (StatefulSet-
# updateStrategy OnDelete); ein Neustart erfolgt bewusst über restart_machines.
# Siehe .github/workflows/fd-bootstrap/docker-dev-full/README.md und den Abschnitt
# „Dev-Container für menschliche Mitglieder" in .squad/team.md.

on:
  workflow_dispatch:
    inputs:
      build_image:
        description: Rebuild and push the fd-dev-full image before deploying
        required: false
        type: boolean
        default: false
      restart_machines:
        description: "DELETES the pods of the listed machines, so ALL DATA IN THE CONTAINER IS LOST (gh/copilot login, worktrees, unpushed work). Empty = restart nothing; all or comma-separated GitHub handles / machine names. Machines with an active SSH session are skipped unless force_restart is set."
        required: false
        type: string
        default: ""
      force_restart:
        description: Also restart machines with an active SSH session (their data is lost)
        required: false
        type: boolean
        default: false
      image:
        description: "Dev machine image as a bare OCI reference, e.g. ghcr.io/<owner>/fd-dev-full:latest (empty = ghcr.io/<owner-lowercase>/fd-dev-full:latest). A pasted 'docker pull …' line is accepted and normalized; anything else aborts the run before a build Job is created."
        required: false
        type: string
        default: ""
  push:
    branches:
      - dev
    paths:
      - ".squad/team.md"
      - ".github/workflows/fd-bootstrap/**"
      - ".github/workflows/fd-bootstrap.yml"
      - "scripts/copilot-environment.mjs"
      - "scripts/copilot-provider.mjs"
      - "scripts/platform-shared.mjs"

permissions:
  contents: read

concurrency:
  group: fd-bootstrap
  cancel-in-progress: false

env:
  NAMESPACE: fd-infra
  KUBECTL_REQUEST_TIMEOUT: 60s
  BOOTSTRAP_DIR: .github/workflows/fd-bootstrap

jobs:
  build-image:
    name: Build fd-dev-full image
    runs-on: [self-hosted, fd]
    permissions:
      contents: read
      packages: write
    outputs:
      built: ${{ steps.plan.outputs.built }}
      image_ref: ${{ steps.images.outputs.image_ref }}
    env:
      KANIKO_NAMESPACE: fd-infra
      KANIKO_JOB_TEMPLATE: .github/workflows/fd-bootstrap/k8s/fd-k8s-kaniko-build-job.yaml
      # Gemessener kalter Build (leerer Layer-Cache, inklusive Cache-Pushes): 437 s;
      # warmer Build (Cache-Treffer für das apt-Layer): 237 s. 900 s lassen Reserve
      # für einen langsameren Cluster-Tag, ohne einen echten Build zum Timeout zu machen.
      KANIKO_JOB_TIMEOUT_SECONDS: "900"
      DOCKERFILE_PATH: .github/workflows/fd-bootstrap/docker-dev-full/Dockerfile
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      # OCI-Image-Referenzen erlauben im Registry-/Repository-Teil nur Kleinbuchstaben.
      # GitHub-Kontextwerte sind nicht normalisiert („Frickeldave"), und eine
      # gemischt geschriebene Referenz lehnt der Kubelet mit InvalidImageName ab;
      # deshalb wird hier jede Image-Referenz aus einem kleingeschriebenen Owner gebildet.
      #
      # Die Eingabe kommt aus einem Freitextfeld im Dispatch-Dialog. Ein von der
      # GHCR-Paketseite kopiertes „docker pull ghcr.io/…" ist deshalb ein erwarteter
      # Fall: Präfix abstreifen, danach Form prüfen. Ungültige Werte brechen hier ab,
      # bevor irgendein kubectl-Aufruf läuft — sonst entsteht erst im Cluster ein
      # Kaniko-Job, der nach Minuten mit einer kryptischen Registry-Meldung scheitert.
      - id: images
        name: Resolve image references
        env:
          INPUT_IMAGE: ${{ inputs.image }}
        run: |
          set -euo pipefail

          # Entfernt umgebende Leerzeichen (auch CR aus Copy-Paste) ohne Subprozess.
          trim() {
            value="$1"
            while :; do
              case "${value}" in
                *[[:space:]]) value="${value%?}" ;;
                *) break ;;
              esac
            done
            while :; do
              case "${value}" in
                [[:space:]]*) value="${value#?}" ;;
                *) break ;;
              esac
            done
            printf '%s' "${value}"
          }

          owner_lc="$(printf '%s' "${GITHUB_REPOSITORY_OWNER:?}" | tr '[:upper:]' '[:lower:]')"
          default_image="ghcr.io/${owner_lc}/fd-dev-full:latest"
          dev_base_image="ghcr.io/${owner_lc}/fd-dev-base:latest"
          kaniko_image="ghcr.io/${owner_lc}/fd-dev-kaniko:latest"
          cache_repo="ghcr.io/${owner_lc}/fd-dev-kaniko-cache"
          input_image="$(trim "${INPUT_IMAGE:-}")"

          if [ -z "${input_image}" ]; then
            image_ref="${default_image}"
          else
            image_ref="${input_image}"
            # Ein mitkopiertes „docker pull …" / „podman pull …" case-insensitiv
            # abstreifen: Die Präfixlänge ist in Original und Kleinschreibung gleich.
            # Reihenfolge zählt, das längere „docker image pull " zuerst.
            input_lc="$(printf '%s' "${image_ref}" | tr '[:upper:]' '[:lower:]')"
            for prefix in 'docker image pull ' 'docker pull ' 'podman pull '; do
              case "${input_lc}" in
                "${prefix}"*)
                  image_ref="$(trim "${image_ref:${#prefix}}")"
                  break
                  ;;
              esac
            done
            if [ -z "${image_ref}" ]; then
              echo "::error::Image input '${input_image}' contains no image reference. Expected an OCI reference like ${default_image} (a pasted 'docker pull ${default_image}' line also works)." >&2
              exit 1
            fi
          fi

          for ref in "${image_ref}" "${dev_base_image}" "${kaniko_image}"; do
            case "${ref}" in
              *[A-Z]*)
                echo "::error::Image reference must be lowercase to be pullable: ${ref}" >&2
                exit 1
                ;;
            esac
          done

          # Explizite OCI-Form: Registry-Host (optional mit Port), mindestens ein
          # Repository-Segment in Kleinbuchstaben, optional ein Tag. Ein Digest oder
          # ein bloßer Host wie „ghcr.io" ist damit ungültig.
          oci_reference='^[a-z0-9]+([.-][a-z0-9]+)*(:[0-9]+)?(/[a-z0-9]+([._-][a-z0-9]+)*)+(:[A-Za-z0-9_][A-Za-z0-9._-]{0,127})?$'
          invalid_image() {
            echo "::error::Invalid image reference '${input_image:-${image_ref}}' (resolved: '${image_ref}'). Expected '<registry-host>/<lowercase/repository>[:tag]', for example ${default_image}; a pasted 'docker pull <reference>' line is normalized." >&2
            exit 1
          }
          # Weißraum (auch ein Zeilenumbruch aus einem mehrzeiligen Copy-Paste) wäre
          # für grep zeilenweise unsichtbar, landet aber genau so im --destination
          # des Kaniko-Jobs — deshalb zuerst verwerfen.
          case "${image_ref}" in
            *[[:space:]]*) invalid_image ;;
          esac
          printf '%s' "${image_ref}" | grep -Eq "${oci_reference}" || invalid_image

          # Der Kaniko-Layer-Cache ist ein GHCR-Repository ohne Tag; auch er muss
          # kleingeschrieben sein (OCI-Repository-Namen), daher separat geprüft.
          case "${cache_repo}" in
            *[A-Z]*)
              echo "::error::Kaniko cache repository must be lowercase: ${cache_repo}" >&2
              exit 1
              ;;
          esac

          {
            echo "DEV_BASE_IMAGE=${dev_base_image}"
            echo "KANIKO_IMAGE=${kaniko_image}"
            echo "CACHE_REPO=${cache_repo}"
            echo "IMAGE_REF=${image_ref}"
          } >> "${GITHUB_ENV}"
          echo "image_ref=${image_ref}" >> "${GITHUB_OUTPUT}"

      - id: plan
        name: Decide whether the image must be rebuilt
        env:
          BUILD_REQUESTED: ${{ inputs.build_image }}
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          set -euo pipefail
          build=false
          if [ "${BUILD_REQUESTED}" = "true" ]; then
            build=true
          elif [ "${GITHUB_EVENT_NAME}" = "push" ]; then
            if [ -z "${BEFORE_SHA}" ] || [ -z "${BEFORE_SHA//0/}" ] || ! git cat-file -e "${BEFORE_SHA}^{commit}" 2>/dev/null; then
              build=true
            elif ! git diff --quiet "${BEFORE_SHA}" "${GITHUB_SHA}" -- "${BOOTSTRAP_DIR}/docker-dev-full" scripts/copilot-environment.mjs scripts/copilot-provider.mjs scripts/platform-shared.mjs; then
              build=true
            fi
          fi
          echo "built=${build}" >> "${GITHUB_OUTPUT}"

          # DNS-1123-konform und <= 63 Zeichen, eindeutig pro Lauf-Versuch.
          # Alle abschließenden Bindestriche werden entfernt: Eine Kürzung könnte den
          # Namen sonst auf „-" enden lassen, was Kubernetes ablehnt.
          job_name="kaniko-fd-dev-full-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          job_name="$(printf '%s' "${job_name}" | tr '[:upper:]' '[:lower:]' | tr -c 'a-z0-9-' '-' | cut -c1-63 | sed 's/-\+$//')"
          echo "job_name=${job_name}" >> "${GITHUB_OUTPUT}"

      - name: Build and push fd-dev-full in a throwaway Kaniko Job
        if: steps.plan.outputs.built == 'true'
        env:
          # Flüchtiges Token pro Lauf; das Secret wird vom Cleanup-Step gelöscht.
          KANIKO_GIT_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          JOB_NAME: ${{ steps.plan.outputs.job_name }}
          GIT_CONTEXT_REF: refs/heads/${{ github.ref_name }}
        run: |
          set -euo pipefail
          secret_name="${JOB_NAME}-git"

          kubectl create secret generic "${secret_name}" \
            --namespace "${KANIKO_NAMESPACE}" \
            --from-literal=token="${KANIKO_GIT_TOKEN}" \
            --dry-run=client -o yaml |
            kubectl apply --request-timeout="${KUBECTL_REQUEST_TIMEOUT}" -f -

          # Kaniko klont den Build-Kontext selbst; gebaut wird der Commit.
          git_context="git://github.com/${GITHUB_REPOSITORY}.git#${GIT_CONTEXT_REF}#${GITHUB_SHA}"
          job_manifest="$(sed \
            -e "s|__JOB_NAME__|${JOB_NAME}|g" \
            -e "s|__NAMESPACE__|${KANIKO_NAMESPACE}|g" \
            -e "s|__KANIKO_IMAGE__|${KANIKO_IMAGE}|g" \
            -e "s|__GIT_TOKEN_SECRET_NAME__|${secret_name}|g" \
            -e "s|__GIT_CONTEXT__|${git_context}|g" \
            -e "s|__DOCKERFILE_PATH__|${DOCKERFILE_PATH}|g" \
            -e "s|__DESTINATION_ARGS__|--destination=${IMAGE_REF}|g" \
            -e "s|__DEV_BASE_IMAGE__|${DEV_BASE_IMAGE}|g" \
            -e "s|__CACHE_REPO__|${CACHE_REPO}|g" \
            -e "/__EXTRA_BUILD_ARGS__/d" \
            "${KANIKO_JOB_TEMPLATE}")"
          printf '%s\n' "${job_manifest}" | kubectl apply --request-timeout="${KUBECTL_REQUEST_TIMEOUT}" -f -

          # `kubectl wait` kehrt bei fehlgeschlagenen Jobs nie zurück, daher beide Conditions pollen.
          deadline=$(( $(date +%s) + KANIKO_JOB_TIMEOUT_SECONDS ))
          build_status="timeout"
          while [ "$(date +%s)" -lt "${deadline}" ]; do
            conditions="$(kubectl get job "${JOB_NAME}" -n "${KANIKO_NAMESPACE}" \
              --request-timeout="${KUBECTL_REQUEST_TIMEOUT}" \
              -o jsonpath='{.status.conditions[?(@.status=="True")].type}' 2>/dev/null || true)"
            case " ${conditions} " in
              *" Failed "*) build_status="failed"; break ;;
              *" Complete "*) build_status="complete"; break ;;
            esac
            sleep 10
          done

          kubectl logs "job/${JOB_NAME}" -n "${KANIKO_NAMESPACE}" --all-containers=true --tail=-1 ||
            echo "No logs available for job/${JOB_NAME}."
          if [ "${build_status}" != "complete" ]; then
            echo "Kaniko build Job ${JOB_NAME} ended with status: ${build_status}" >&2
            exit 1
          fi

      - name: Clean up Kaniko build Job and git token secret
        if: always() && steps.plan.outputs.built == 'true'
        env:
          JOB_NAME: ${{ steps.plan.outputs.job_name }}
        run: |
          kubectl delete job "${JOB_NAME}" -n "${KANIKO_NAMESPACE}" \
            --request-timeout="${KUBECTL_REQUEST_TIMEOUT}" --ignore-not-found || true
          kubectl delete secret "${JOB_NAME}-git" -n "${KANIKO_NAMESPACE}" \
            --request-timeout="${KUBECTL_REQUEST_TIMEOUT}" --ignore-not-found || true

  dev-machines:
    needs: build-image
    runs-on: [self-hosted, fd]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Render dev machine manifests
        env:
          IMAGE: ${{ needs.build-image.outputs.image_ref }}
        run: |
          set -euo pipefail
          node "${BOOTSTRAP_DIR}/dev-machines.mjs" render \
            --namespace "${NAMESPACE}" --image "${IMAGE}" > dev-machines.yaml
          node "${BOOTSTRAP_DIR}/dev-machines.mjs" names > dev-machines.names
          echo "Desired dev machines:"
          cat dev-machines.names

      - name: Apply dev machines
        run: |
          set -euo pipefail
          if [ -s dev-machines.yaml ] && [ -s dev-machines.names ]; then
            kubectl apply --request-timeout="${KUBECTL_REQUEST_TIMEOUT}" -f dev-machines.yaml
          else
            echo "No human member with a GitHub handle in .squad/team.md; nothing to apply."
          fi

      - name: Delete machines of removed developers
        run: |
          set -euo pipefail
          kubectl get statefulset,service -n "${NAMESPACE}" \
            -l app.kubernetes.io/part-of=fd-dev-machines \
            --request-timeout="${KUBECTL_REQUEST_TIMEOUT}" -o name > dev-machines.existing
          node "${BOOTSTRAP_DIR}/dev-machines.mjs" stale < dev-machines.existing > dev-machines.stale
          if [ -s dev-machines.stale ]; then
            echo "Removing stale dev machines:"
            cat dev-machines.stale
            xargs -r kubectl delete -n "${NAMESPACE}" --ignore-not-found \
              --request-timeout="${KUBECTL_REQUEST_TIMEOUT}" < dev-machines.stale
          else
            echo "No stale dev machines."
          fi

      - name: Restart selected machines (deliberate, data is lost)
        if: inputs.restart_machines != ''
        env:
          RESTART_TARGETS: ${{ inputs.restart_machines }}
          FORCE_RESTART: ${{ inputs.force_restart }}
          MACHINES_FILE: dev-machines.restart
          SESSIONS_SCRIPT: .github/workflows/fd-bootstrap/active-sessions.sh
        run: |
          set -euo pipefail
          node "${BOOTSTRAP_DIR}/dev-machines.mjs" select --targets "${RESTART_TARGETS}" > "${MACHINES_FILE}"
          if [ ! -s "${MACHINES_FILE}" ]; then
            echo "restart_machines matched no dev machine; nothing restarted."
            exit 0
          fi
          bash "${BOOTSTRAP_DIR}/restart-machines.sh"

      - name: Wait for new or restarted machines
        run: |
          set -euo pipefail
          # OnDelete-StatefulSets melden keinen Update-Fortschritt über `rollout status`;
          # daher direkt auf den Pod warten (vom StatefulSet-Controller erzeugt).
          while read -r machine; do
            pod="${machine}-0"
            deadline=$(( $(date +%s) + 120 ))
            until kubectl get pod "${pod}" -n "${NAMESPACE}" --request-timeout="${KUBECTL_REQUEST_TIMEOUT}" >/dev/null 2>&1; do
              if [ "$(date +%s)" -ge "${deadline}" ]; then
                echo "Pod ${pod} was not created within 120s." >&2
                exit 1
              fi
              sleep 3
            done
            kubectl wait --for=condition=Ready "pod/${pod}" -n "${NAMESPACE}" --timeout=300s
          done < dev-machines.names

      - name: Report machines still on an old image or spec
        env:
          IMAGE_BUILT: ${{ needs.build-image.outputs.built }}
          MACHINES_FILE: dev-machines.names
        run: bash "${BOOTSTRAP_DIR}/report-outdated.sh"
