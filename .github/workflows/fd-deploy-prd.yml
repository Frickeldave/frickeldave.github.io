name: fd-deploy-prd (CI gate, merge dev→main, deploy Pages)

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run — print what would happen without merging or pushing"
        required: false
        default: false
        type: boolean

# Phases: ci-gate dispatches fd-ci and waits (actions: write); promote merges
# dev into main (contents: write); deploy-pages builds + publishes the site
# (pages + id-token); release tags + releases only AFTER a successful Pages
# deploy (contents: write) so a failed deploy does not consume a version.
#
# Release model and state logic:
#   dev releases  = pre-releases `dev-v<version>` (fd-deploy-dev), never deployed
#                   to production and never used as the comparison baseline.
#   stable releases = `v<version>`, `isPrerelease == false`, no `dev-v` tag.
#                   `promote` compares against the newest of these only, so a
#                   dev pre-release can never block a promotion.
#
#   promote (outputs: dev_version, latest_stable, main_version, should_deploy)
#     dev_version <= latest_stable → no merge (nothing new to promote) and
#                                    should_deploy=false.
#     dev_version  > latest_stable → merge dev→main (a second run is a no-op:
#                                    "Already up to date"/"Everything up-to-date"),
#                                    then read the version from main.
#     main_version  > latest_stable → should_deploy=true  → deploy-pages + release.
#     main_version <= latest_stable → should_deploy=false → both are skipped and
#                                    the run stays green with a ::notice::
#                                    ("nichts zu deployen, main ist bereits
#                                    veröffentlicht"). Retrying after a failed
#                                    deploy therefore needs no version bump.
#
#   dry_run: nothing is merged, dispatched, tagged, released or deployed; the
#            promotion decision is still computed and printed.
permissions:
  contents: write
  actions: write
  pages: write
  id-token: write

concurrency:
  group: fd-deploy-prd
  cancel-in-progress: false

jobs:
  ci-gate:
    name: Gate — FD CI must pass on dev
    runs-on: ubuntu-latest
    env:
      # The ci-gate job has no checkout step, so `gh` cannot auto-detect the
      # repository from a git remote. Pin it explicitly for all gh commands.
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Dry run — explain CI gate
        if: ${{ inputs.dry_run }}
        run: |
          echo "🔍 DRY RUN — before merging, this workflow would run fd-ci on dev and wait for it to succeed."

      - name: Run FD CI on dev
        id: dispatch
        if: ${{ !inputs.dry_run }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          STARTED_AT=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          echo "started_at=$STARTED_AT" >> "$GITHUB_OUTPUT"
          gh workflow run fd-ci.yml --ref dev
          echo "✅ Dispatched fd-ci.yml on dev (started-at: $STARTED_AT)"

      - name: Wait for FD CI success
        if: ${{ !inputs.dry_run }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          STARTED_AT="${{ steps.dispatch.outputs.started_at }}"
          RUN_ID=""
          for i in $(seq 1 90); do
            RUN_ID=$(gh run list --workflow=fd-ci.yml --branch dev --created ">$STARTED_AT" --limit 1 --json databaseId --jq '.[0].databaseId // empty')
            if [ -n "$RUN_ID" ]; then
              break
            fi
            echo "⏳ Waiting for fd-ci run to appear (attempt $i)..."
            sleep 10
          done
          if [ -z "$RUN_ID" ]; then
            echo "::error::Timed out waiting for fd-ci run to appear on dev."
            exit 1
          fi
          echo "🔎 Watching fd-ci run: $RUN_ID"
          gh run watch "$RUN_ID" --exit-status --interval 15
          echo "✅ FD CI passed on dev"

  promote:
    name: Promote dev → main
    needs: ci-gate
    runs-on: ubuntu-latest
    outputs:
      dev_version: ${{ steps.version.outputs.version }}
      latest_stable: ${{ steps.latest.outputs.tag }}
      main_version: ${{ steps.decide.outputs.main_version }}
      should_deploy: ${{ steps.decide.outputs.should_deploy }}
      tag: ${{ steps.decide.outputs.tag }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 #v4
        with:
          ref: dev
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 #v4
        with:
          node-version: 24

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Fetch all branches
        run: git fetch --all

      - name: Read version from package.json
        id: version
        run: |
          VERSION=$(node -e "console.log(require('./package.json').version)")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"
          echo "📦 Version: $VERSION (tag: v$VERSION)"

      - name: Validate version consistency with CHANGELOG
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          if ! grep -q "## \[$VERSION\]" CHANGELOG.md 2>/dev/null; then
            echo "::error::Version $VERSION not found in CHANGELOG.md — update CHANGELOG.md before promoting."
            exit 1
          fi
          echo "✅ Version $VERSION has a CHANGELOG entry"

      # Only stable releases count as the baseline. `gh release list` is ordered
      # newest first; drafts never block, and `dev-v*` pre-releases are excluded
      # twice (isPrerelease and tag prefix) so they can never block or delay a
      # production promotion.
      - name: Determine latest stable GitHub release
        id: latest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          LATEST=$(gh release list --limit 100 --exclude-drafts --json tagName,isPrerelease \
            --jq '[.[] | select((.isPrerelease == false) and ((.tagName | startswith("dev-v")) | not))][0].tagName // empty' \
            2>/dev/null || true)
          if [ -z "$LATEST" ]; then
            echo "ℹ️ No stable GitHub release yet — every version is an upgrade."
          else
            echo "🔎 Latest stable GitHub release: $LATEST"
          fi
          echo "tag=$LATEST" >> "$GITHUB_OUTPUT"

      - name: Decide whether dev is ahead of the latest stable release
        id: dev_gate
        env:
          DEV_VERSION: ${{ steps.version.outputs.version }}
          LATEST_TAG: ${{ steps.latest.outputs.tag }}
        run: |
          if [ -z "$LATEST_TAG" ]; then
            echo "newer=true" >> "$GITHUB_OUTPUT"
            echo "::notice::No stable release yet — dev $DEV_VERSION will be promoted."
            exit 0
          fi
          if DEV="$DEV_VERSION" BASE="$LATEST_TAG" node -e '
            const parse = (v) => String(v).replace(/^v/, "").split(".").map(Number);
            const a = parse(process.env.DEV);
            const b = parse(process.env.BASE);
            for (let i = 0; i < 3; i++) {
              const x = a[i] || 0;
              const y = b[i] || 0;
              if (x !== y) process.exit(x > y ? 0 : 1);
            }
            process.exit(1);
          '; then
            echo "newer=true" >> "$GITHUB_OUTPUT"
            echo "::notice::dev $DEV_VERSION > latest stable release $LATEST_TAG — dev is promoted to main."
          else
            echo "newer=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Nothing to promote: dev $DEV_VERSION is not higher than the latest stable release $LATEST_TAG."
          fi

      - name: Dry run — show plan
        if: ${{ inputs.dry_run }}
        run: |
          echo "🔍 DRY RUN — no changes will be made."
          echo "dev version      : ${{ steps.version.outputs.version }}"
          echo "latest stable rel: ${{ steps.latest.outputs.tag }}"
          echo "dev is ahead     : ${{ steps.dev_gate.outputs.newer }}"
          echo "Would merge origin/dev into main with message:"
          echo "  chore(release): promote dev to main v${{ steps.version.outputs.version }}"
          echo "Then: build + deploy the site to GitHub Pages."
          echo "Then (only if deploy succeeds): tag and release: ${{ steps.version.outputs.tag }}"

      - name: Merge dev → main
        # Only when dev actually carries a newer version; otherwise the merge
        # would move main without a deploy. A repeated run merges nothing.
        if: ${{ !inputs.dry_run && steps.dev_gate.outputs.newer == 'true' }}
        run: |
          git checkout main
          git merge origin/dev --no-ff -m "chore(release): promote dev to main v${{ steps.version.outputs.version }}"
          git push origin main
          echo "✅ Pushed main"

      # The deployed state is defined by main, not by dev: after the merge the
      # version of main decides whether Pages + the stable release run at all.
      - name: Read version from main and decide
        id: decide
        env:
          LATEST_TAG: ${{ steps.latest.outputs.tag }}
        run: |
          MAIN_VERSION=$(git show origin/main:package.json | node -e '
            let data = "";
            process.stdin.on("data", (chunk) => (data += chunk));
            process.stdin.on("end", () => console.log(JSON.parse(data).version));
          ')
          echo "main_version=$MAIN_VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$MAIN_VERSION" >> "$GITHUB_OUTPUT"
          echo "🔎 Version on main: $MAIN_VERSION"

          if [ -z "$LATEST_TAG" ]; then
            echo "should_deploy=true" >> "$GITHUB_OUTPUT"
            echo "::notice::No stable release yet — main $MAIN_VERSION is deployed."
          elif MAIN="$MAIN_VERSION" BASE="$LATEST_TAG" node -e '
            const parse = (v) => String(v).replace(/^v/, "").split(".").map(Number);
            const a = parse(process.env.MAIN);
            const b = parse(process.env.BASE);
            for (let i = 0; i < 3; i++) {
              const x = a[i] || 0;
              const y = b[i] || 0;
              if (x !== y) process.exit(x > y ? 0 : 1);
            }
            process.exit(1);
          '; then
            echo "should_deploy=true" >> "$GITHUB_OUTPUT"
            echo "::notice::main $MAIN_VERSION > latest stable release $LATEST_TAG — deploying."
          else
            echo "should_deploy=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Nichts zu deployen: main $MAIN_VERSION ist nicht höher als das letzte stabile Release $LATEST_TAG. deploy-pages und release werden übersprungen."
          fi

      - name: Write promotion summary
        if: ${{ always() }}
        run: |
          {
            echo "### fd-deploy-prd promotion"
            echo
            echo "| | |"
            echo "|---|---|"
            echo "| dev version | \`${{ steps.version.outputs.version }}\` |"
            echo "| latest stable release | \`${{ steps.latest.outputs.tag }}\` |"
            echo "| dev ahead of stable | \`${{ steps.dev_gate.outputs.newer }}\` |"
            echo "| version on main | \`${{ steps.decide.outputs.main_version }}\` |"
            echo "| deploy + release | \`${{ steps.decide.outputs.should_deploy }}\` |"
            echo "| dry run | \`${{ inputs.dry_run }}\` |"
          } >> "$GITHUB_STEP_SUMMARY"

      # NOTE: Tag + release are intentionally NOT created here.
      # They are deferred to the `release` job, which runs only after the
      # Pages deploy succeeded — so a failed deploy does not consume a version.

  deploy-pages:
    name: Build & deploy to GitHub Pages
    needs: promote
    # Runs only when main really carries a version above the latest stable
    # release (see the state logic in the header); otherwise the run stays green
    # without deploying.
    if: ${{ !inputs.dry_run && needs.promote.outputs.should_deploy == 'true' }}
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # IMPORTANT: withastro/action does NOT check out the repository itself.
      # It expects an already-checked-out tree; without this checkout it fails
      # with "No lockfile found" because it inspects an empty directory.
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 #v4
        with:
          ref: main

      - name: Install, build, and upload your site
        uses: withastro/action@v3
        with:
          path: .
          node-version: 24
          package-manager: npm

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  release:
    name: Tag & release (after Pages deploy)
    needs: deploy-pages
    if: ${{ !inputs.dry_run && needs.promote.outputs.should_deploy == 'true' }}
    runs-on: ubuntu-latest
    steps:
      # Deferred tag + release: only runs after deploy-pages succeeded, so a
      # failed deploy does not burn a version number (retry needs no bump).
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 #v4
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 #v4
        with:
          node-version: 24

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Read version from package.json
        id: version
        run: |
          VERSION=$(node -e "console.log(require('./package.json').version)")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"

      - name: Create git tag
        run: |
          TAG="${{ steps.version.outputs.tag }}"
          if git rev-parse "refs/tags/$TAG" >/dev/null 2>&1; then
            echo "⏭️ Tag $TAG already exists — skipping."
          else
            git tag -a "$TAG" -m "Release $TAG"
            git push origin "$TAG"
            echo "✅ Created and pushed tag $TAG"
          fi

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ steps.version.outputs.tag }}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "⏭️ Release $TAG already exists — skipping."
          else
            gh release create "$TAG" --title "$TAG" --generate-notes --latest
            echo "✅ Created GitHub release $TAG"
          fi
