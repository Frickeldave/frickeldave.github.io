name: fd-deploy-prd (CI gate, merge dev→main, deploy Pages)

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run — print what would happen without merging or pushing"
        required: false
        default: false
        type: boolean
      force_deploy:
        description: "Force a Pages deploy without a new merge (retry after a failed deploy)"
        required: false
        default: false
        type: boolean

# Phasen: ci-gate dispatcht fd-ci und wartet (actions: write); promote merged
# dev nach main (contents: write); deploy-pages baut und veröffentlicht die Seite
# (pages + id-token); release taggt und veröffentlicht erst NACH einem erfolgreichen
# Pages-Deploy (contents: write), damit ein fehlgeschlagener Deploy keine Version verbraucht.
#
# Release-Modell und Zustandslogik — zwei getrennte Gates:
# dev-Releases    = Pre-Releases `dev-v<version>` (fd-deploy-dev), nie nach Produktion
# deployt und nie als Vergleichsbasis verwendet.
# stabile Releases = `v<version>`, `isPrerelease == false`, kein `dev-v`-Tag.
# `promote` vergleicht nur gegen das neueste davon, ein dev-Pre-Release kann eine
# Promotion daher nie blockieren.
#
# Gate 1 — „darf nach main?" (`promote`, Outputs: relation, newer, promote)
# dev_version  > latest_stable → `relation=greater`: promote=true, Merge dev→main
#                                (ein zweiter Lauf ist ein No-Op: „Already up to date").
# dev_version == latest_stable → `relation=equal`:
#                                Diff `origin/main..origin/dev` enthält mindestens
#                                einen verwalteten Katalog-/Produktbildpfad und
#                                keinen seitenrelevanten Pfad (scripts/catalog-only.mjs,
#                                Klassifikation `promote_safe`; Allowlist wie
#                                `_is_managed_path` in der Store-Sync-Integration)
#                                → promote=true, ::notice:: unterscheidet „nur Katalog"
#                                von „Katalog plus unkritische Pfade".
#                                sonst (leer, nur Docs, oder seitenrelevante Pfade)
#                                → promote=false, kein Merge, Lauf bleibt grün.
# dev_version  < latest_stable → `relation=less`: ::error:: und exit 1 (dev liegt
#                                hinter main zurück, echter Anomaliezustand).
# `main` darf damit Daten-Commits ohne Release enthalten; die Footer-Version bleibt
# bei einem reinen Daten-Deploy unverändert. Deploy-neutral sind z. B. `docs/**`,
# `.squad/**`, `.github/**`, `.husky/**`, `test/**`, CHANGELOG/README und
# Tooling-Configs; `src/**`, `public/**` (außer dem Katalog), Root-Build-Eingaben und
# `scripts/build-*`/`scripts/install-*` verlangen weiterhin ein Release.
#
# Gate 2 — „ist das ein Release?" (`decide`, Outputs: main_version, tag,
# should_deploy, should_release)
# should_deploy  = main hat sich durch den Merge geändert (Diff vor/nach dem Merge)
#                  || force_deploy (Retry nach fehlgeschlagenem Pages-Deploy).
# should_release = main_version > latest_stable (bzw. noch kein stabiles Release).
# deploy-pages läuft bei should_deploy; release zusätzlich nur bei should_release.
# Ein Katalog-Deploy erzeugt daher nie einen Tag oder ein Release.
#
# dry_run: Nichts wird gemerged, dispatcht, getaggt, veröffentlicht oder deployt; die
# Promotion-Entscheidung wird trotzdem berechnet und ausgegeben.
#
# fd-promote-prd (manueller Weg) behält bis zum Follow-up den strengen Versions-Gate.
permissions:
  contents: write
  actions: write
  pages: write
  id-token: write

concurrency:
  group: fd-deploy-prd
  cancel-in-progress: false

jobs:
  ci-gate:
    name: Gate — FD CI must pass on dev
    runs-on: ubuntu-latest
    env:
      # Der ci-gate-Job hat keinen Checkout-Step, `gh` kann das Repository also nicht
      # aus einem Git-Remote ableiten. Deshalb für alle gh-Befehle explizit gepinnt.
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Dry run — explain CI gate
        if: ${{ inputs.dry_run }}
        run: |
          echo "🔍 DRY RUN — before merging, this workflow would run fd-ci on dev and wait for it to succeed."

      - name: Run FD CI on dev
        id: dispatch
        if: ${{ !inputs.dry_run }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          STARTED_AT=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          echo "started_at=$STARTED_AT" >> "$GITHUB_OUTPUT"
          gh workflow run fd-ci.yml --ref dev
          echo "✅ Dispatched fd-ci.yml on dev (started-at: $STARTED_AT)"

      - name: Wait for FD CI success
        if: ${{ !inputs.dry_run }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          STARTED_AT="${{ steps.dispatch.outputs.started_at }}"
          RUN_ID=""
          for i in $(seq 1 90); do
            RUN_ID=$(gh run list --workflow=fd-ci.yml --branch dev --created ">$STARTED_AT" --limit 1 --json databaseId --jq '.[0].databaseId // empty')
            if [ -n "$RUN_ID" ]; then
              break
            fi
            echo "⏳ Waiting for fd-ci run to appear (attempt $i)..."
            sleep 10
          done
          if [ -z "$RUN_ID" ]; then
            echo "::error::Timed out waiting for fd-ci run to appear on dev."
            exit 1
          fi
          echo "🔎 Watching fd-ci run: $RUN_ID"
          gh run watch "$RUN_ID" --exit-status --interval 15
          echo "✅ FD CI passed on dev"

  promote:
    name: Promote dev → main
    needs: ci-gate
    runs-on: ubuntu-latest
    outputs:
      dev_version: ${{ steps.version.outputs.version }}
      latest_stable: ${{ steps.latest.outputs.tag }}
      main_version: ${{ steps.decide.outputs.main_version }}
      catalog_only: ${{ steps.diff.outputs.catalog_only }}
      promote_safe: ${{ steps.diff.outputs.promote_safe }}
      classification: ${{ steps.diff.outputs.classification }}
      changed_files: ${{ steps.diff.outputs.changed_files }}
      should_deploy: ${{ steps.decide.outputs.should_deploy }}
      should_release: ${{ steps.decide.outputs.should_release }}
      tag: ${{ steps.decide.outputs.tag }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 #v4
        with:
          ref: dev
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 #v4
        with:
          node-version: 24

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Fetch all branches
        run: git fetch --all

      - name: Read version from package.json
        id: version
        run: |
          VERSION=$(node -e "console.log(require('./package.json').version)")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"
          echo "📦 Version: $VERSION (tag: v$VERSION)"

      # Nur stabile Releases zählen als Basis. `gh release list` ist absteigend nach
      # Erstellungsdatum sortiert; Drafts blockieren nie, `dev-v*`-Pre-Releases werden
      # doppelt ausgeschlossen (isPrerelease und Tag-Prefix), damit sie eine Promotion
      # nie blockieren oder verzögern.
      - name: Determine latest stable GitHub release
        id: latest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          LATEST=$(gh release list --limit 100 --exclude-drafts --json tagName,isPrerelease \
            --jq '[.[] | select((.isPrerelease == false) and ((.tagName | startswith("dev-v")) | not))][0].tagName // empty' \
            2>/dev/null || true)
          if [ -z "$LATEST" ]; then
            echo "ℹ️ No stable GitHub release yet — every version is an upgrade."
          else
            echo "🔎 Latest stable GitHub release: $LATEST"
          fi
          echo "tag=$LATEST" >> "$GITHUB_OUTPUT"

      # Klassifikation in zwei Stufen (scripts/catalog-only.mjs):
      #   catalog_only — Diff besteht ausschließlich aus Katalogmaterial (Reporting,
      #                  Allowlist exakt wie `_is_managed_path`/`_MANAGED_IMAGE_RE`:
      #                  public/data/handmade.json plus Produktbilder unter
      #                  src/assets/handmade/<3D|EP|LA|SB|WO>/<Artikel>/<Artikel>-NN.<ext>).
      #   promote_safe — mindestens ein Katalogpfad und kein seitenrelevanter Pfad;
      #                  deploy-neutrale Pfade (Docs, .squad, .github, Tests, CHANGELOG …)
      #                  sind erlaubt. `src/**`, `public/**` außer dem Katalog, Root-Build-
      #                  Eingaben und scripts/build-*|install-* sind seitenrelevant.
      - name: Classify dev → main diff
        id: diff
        run: |
          set -euo pipefail
          CLASSIFICATION_JSON=$(git diff --name-only origin/main origin/dev | node scripts/catalog-only.mjs --json)
          printf '%s\n' "$CLASSIFICATION_JSON" | node -e '
            let raw = "";
            process.stdin.on("data", (chunk) => (raw += chunk));
            process.stdin.on("end", () => {
              const result = JSON.parse(raw);
              const lines = [
                `catalog_only=${result.catalog_only}`,
                `promote_safe=${result.promote_safe}`,
                `changed_files=${result.files}`,
                `classification=${result.classification}`,
              ];
              require("node:fs").appendFileSync(process.env.GITHUB_OUTPUT, `${lines.join("\n")}\n`);
              console.log(result.summary);
              console.log(
                `🔎 ${result.files} geänderte Datei(en) zwischen main und dev — ` +
                  `${result.managed} Katalog, ${result.neutral} neutral, ${result.site.length} seitenrelevant`,
              );
            });
          '

      # Drei Relationen plus Katalog-Sonderfall. „Gleich" ist der Normalfall nach
      # einer Promotion und darf keinen roten Lauf erzeugen — es sei denn, der Diff
      # enthält mindestens einen verwalteten Katalog-/Produktbildpfad und keinen
      # seitenrelevanten Pfad (deploy-neutrale Pfade wie Docs/.squad/CHANGELOG sind
      # erlaubt). Dann darf auch ohne Versions-Bump nach main promotet werden
      # (Gate 1). „Kleiner" heißt, dass `dev` hinter `main` zurückliegt — ein echter
      # Anomaliezustand, der laut scheitern muss.
      - name: Decide whether dev is ahead of the latest stable release
        id: dev_gate
        env:
          DEV_VERSION: ${{ steps.version.outputs.version }}
          LATEST_TAG: ${{ steps.latest.outputs.tag }}
          CATALOG_ONLY: ${{ steps.diff.outputs.catalog_only }}
          PROMOTE_SAFE: ${{ steps.diff.outputs.promote_safe }}
          CLASSIFICATION: ${{ steps.diff.outputs.classification }}
          CHANGED_FILES: ${{ steps.diff.outputs.changed_files }}
        run: |
          set -euo pipefail
          if [ -z "$LATEST_TAG" ]; then
            echo "relation=none" >> "$GITHUB_OUTPUT"
            echo "newer=true" >> "$GITHUB_OUTPUT"
            echo "promote=true" >> "$GITHUB_OUTPUT"
            echo "should_release=true" >> "$GITHUB_OUTPUT"
            echo "::notice::Noch kein stabiles Release — dev $DEV_VERSION wird promotet."
            exit 0
          fi
          RELATION=$(DEV="$DEV_VERSION" BASE="$LATEST_TAG" node -e '
            const parse = (v) => String(v).replace(/^v/, "").split(".").map(Number);
            const a = parse(process.env.DEV);
            const b = parse(process.env.BASE);
            for (let i = 0; i < 3; i++) {
              const x = a[i] || 0;
              const y = b[i] || 0;
              if (x !== y) { console.log(x > y ? "greater" : "less"); process.exit(0); }
            }
            console.log("equal");
          ')
          echo "relation=$RELATION" >> "$GITHUB_OUTPUT"
          case "$RELATION" in
            greater)
              echo "newer=true" >> "$GITHUB_OUTPUT"
              echo "promote=true" >> "$GITHUB_OUTPUT"
              echo "should_release=true" >> "$GITHUB_OUTPUT"
              echo "::notice::dev $DEV_VERSION > letztes stabiles Release $LATEST_TAG — dev wird nach main promotet."
              ;;
            equal)
              echo "newer=false" >> "$GITHUB_OUTPUT"
              echo "should_release=false" >> "$GITHUB_OUTPUT"
              if [ "$PROMOTE_SAFE" = "true" ] && [ "$CHANGED_FILES" -gt 0 ]; then
                echo "promote=true" >> "$GITHUB_OUTPUT"
                if [ "$CATALOG_ONLY" = "true" ]; then
                  echo "::notice::dev entspricht dem letzten stabilen Release $LATEST_TAG. Der Diff ($CHANGED_FILES Datei(en), Klassifikation $CLASSIFICATION) besteht ausschließlich aus Katalog-/Produktbildmaterial — nur Katalog, Merge nach main ohne Release, die Footer-Version bleibt unverändert."
                else
                  echo "::notice::dev entspricht dem letzten stabilen Release $LATEST_TAG. Der Diff ($CHANGED_FILES Datei(en), Klassifikation $CLASSIFICATION) enthält Katalogmaterial plus unkritische, deploy-neutrale Pfade und keinen seitenrelevanten Pfad — Merge nach main ohne Release, die Footer-Version bleibt unverändert."
                fi
              else
                echo "promote=false" >> "$GITHUB_OUTPUT"
                echo "::notice::dev entspricht bereits dem letzten stabilen Release $LATEST_TAG — nichts zu promoten, kein Merge (Klassifikation $CLASSIFICATION)."
              fi
              ;;
            less)
              echo "newer=false" >> "$GITHUB_OUTPUT"
              echo "promote=false" >> "$GITHUB_OUTPUT"
              echo "should_release=false" >> "$GITHUB_OUTPUT"
              echo "::error::dev $DEV_VERSION ist älter als das letzte stabile Release $LATEST_TAG. dev liegt hinter main — Version in package.json prüfen und dev nachziehen."
              exit 1
              ;;
            *)
              echo "newer=false" >> "$GITHUB_OUTPUT"
              echo "promote=false" >> "$GITHUB_OUTPUT"
              echo "should_release=false" >> "$GITHUB_OUTPUT"
              echo "::error::Unerwartetes Vergleichsergebnis \"$RELATION\"."
              exit 1
              ;;
          esac

      # Release-Buchhaltung nur prüfen, wenn dieser Lauf tatsächlich ein Release
      # erzeugen kann. Ein reiner Katalog-Deploy (relation=equal) darf nie an
      # CHANGELOG/Version scheitern. Bewusst VOR dem Merge, damit main ohne
      # vollständige Buchhaltung nicht vorrückt.
      - name: Validate version consistency with CHANGELOG
        if: ${{ steps.dev_gate.outputs.should_release == 'true' }}
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          if ! grep -q "## \[$VERSION\]" CHANGELOG.md 2>/dev/null; then
            echo "::error::Version $VERSION not found in CHANGELOG.md — update CHANGELOG.md before promoting."
            exit 1
          fi
          echo "✅ Version $VERSION has a CHANGELOG entry"

      - name: Remember main before promotion
        id: main_before
        run: echo "sha=$(git rev-parse origin/main)" >> "$GITHUB_OUTPUT"

      - name: Merge dev → main
        # Gate 1: nur wenn `promote=true` (neuere Version oder Katalog-Diff mit
        # ausschließlich deploy-neutralen Zusatzpfaden). Ein wiederholter Lauf merged nichts.
        if: ${{ !inputs.dry_run && steps.dev_gate.outputs.promote == 'true' }}
        run: |
          git checkout main
          if [ "${{ steps.dev_gate.outputs.relation }}" = "equal" ]; then
            git merge origin/dev --no-ff -m "chore(deploy): promote catalog changes with deploy-neutral paths from dev"
          else
            git merge origin/dev --no-ff -m "chore(release): promote dev to main v${{ steps.version.outputs.version }}"
          fi
          git push origin main
          echo "✅ Pushed main"

      # Gate 2 — „ist das ein Release?": Der deployte Zustand wird von main bestimmt,
      # nicht von dev. `MAIN_BEFORE` ist der main-Stand vor dem Merge; nur wenn main
      # dadurch vorgerückt ist, gibt es etwas zu deployen. Ohne Merge bleibt main
      # unverändert — dann deckt nur `force_deploy` einen Retry ab.
      - name: Read version from main and decide
        id: decide
        env:
          LATEST_TAG: ${{ steps.latest.outputs.tag }}
          MAIN_BEFORE: ${{ steps.main_before.outputs.sha }}
          PROMOTE: ${{ steps.dev_gate.outputs.promote }}
          DRY_RUN: ${{ inputs.dry_run }}
          FORCE_DEPLOY: ${{ inputs.force_deploy }}
        run: |
          set -euo pipefail
          if [ "$PROMOTE" = "true" ]; then
            # Im Dry-Run ist HEAD noch dev; dessen Version ist die hypothetische
            # main-Version nach dem Merge. Im echten Lauf ist HEAD der Merge-Commit.
            VERSION_REF="HEAD"
          else
            VERSION_REF="origin/main"
          fi
          MAIN_VERSION=$(git show "$VERSION_REF":package.json | node -e '
            let data = "";
            process.stdin.on("data", (chunk) => (data += chunk));
            process.stdin.on("end", () => console.log(JSON.parse(data).version));
          ')
          echo "main_version=$MAIN_VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$MAIN_VERSION" >> "$GITHUB_OUTPUT"
          echo "🔎 Version on main: $MAIN_VERSION"

          CHANGED_FILES=0
          if [ "$PROMOTE" = "true" ]; then
            if [ "$DRY_RUN" = "true" ]; then
              COMPARE_HEAD="origin/dev"
            else
              COMPARE_HEAD="HEAD"
            fi
            CHANGED_LIST=$(git diff --name-only "$MAIN_BEFORE" "$COMPARE_HEAD")
            if [ -n "$CHANGED_LIST" ]; then
              CHANGED_FILES=$(printf '%s\n' "$CHANGED_LIST" | wc -l | tr -d ' ')
            fi
          fi
          echo "changed_files=$CHANGED_FILES" >> "$GITHUB_OUTPUT"
          echo "🔎 main changes since promotion start: $CHANGED_FILES Datei(en)"

          if [ "$CHANGED_FILES" -gt 0 ] || [ "$FORCE_DEPLOY" = "true" ]; then
            echo "should_deploy=true" >> "$GITHUB_OUTPUT"
            echo "::notice::main hat sich geändert ($CHANGED_FILES Datei(en)) — Pages wird deployt."
          else
            echo "should_deploy=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Nichts zu deployen: main ist unverändert. deploy-pages und release werden übersprungen; für einen Retry nach fehlgeschlagenem Deploy force_deploy=true setzen."
          fi

          if [ -z "$LATEST_TAG" ]; then
            echo "should_release=true" >> "$GITHUB_OUTPUT"
            echo "::notice::No stable release yet — main $MAIN_VERSION is released."
          elif MAIN="$MAIN_VERSION" BASE="$LATEST_TAG" node -e '
            const parse = (v) => String(v).replace(/^v/, "").split(".").map(Number);
            const a = parse(process.env.MAIN);
            const b = parse(process.env.BASE);
            for (let i = 0; i < 3; i++) {
              const x = a[i] || 0;
              const y = b[i] || 0;
              if (x !== y) process.exit(x > y ? 0 : 1);
            }
            process.exit(1);
          '; then
            echo "should_release=true" >> "$GITHUB_OUTPUT"
            echo "::notice::main $MAIN_VERSION > latest stable release $LATEST_TAG — releasing after a successful deploy."
          else
            echo "should_release=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Kein Release: main $MAIN_VERSION ist nicht höher als das letzte stabile Release $LATEST_TAG (Katalog-Deploy ohne Versions-Bump)."
          fi

      - name: Dry run — show plan
        if: ${{ inputs.dry_run }}
        run: |
          echo "🔍 DRY RUN — no changes will be made."
          echo "dev version      : ${{ steps.version.outputs.version }}"
          echo "latest stable rel: ${{ steps.latest.outputs.tag }}"
          echo "relation         : ${{ steps.dev_gate.outputs.relation }}"
          echo "promote to main  : ${{ steps.dev_gate.outputs.promote }}"
          echo "changed files    : ${{ steps.diff.outputs.changed_files }} (main..dev)"
          echo "promote safe     : ${{ steps.diff.outputs.promote_safe }}"
          echo "classification   : ${{ steps.diff.outputs.classification }}"
          echo "catalog only     : ${{ steps.diff.outputs.catalog_only }} (informativ)"
          echo "version on main  : ${{ steps.decide.outputs.main_version }}"
          echo "would deploy     : ${{ steps.decide.outputs.should_deploy }}"
          echo "would release    : ${{ steps.decide.outputs.should_release }}"
          echo "force deploy     : ${{ inputs.force_deploy }}"
          echo "Would merge origin/dev into main when promote=true."
          echo "Then: build + deploy the site to GitHub Pages when should_deploy=true."
          echo "Then (only if deploy succeeds): tag and release ${{ steps.decide.outputs.tag }} when should_release=true."

      - name: Write promotion summary
        if: ${{ always() }}
        run: |
          {
            echo "### fd-deploy-prd promotion"
            echo
            echo "| | |"
            echo "|---|---|"
            echo "| dev version | \`${{ steps.version.outputs.version }}\` |"
            echo "| latest stable release | \`${{ steps.latest.outputs.tag }}\` |"
            echo "| relation | \`${{ steps.dev_gate.outputs.relation }}\` |"
            echo "| promote safe (main..dev) | \`${{ steps.diff.outputs.promote_safe }}\` |"
            echo "| classification (main..dev) | \`${{ steps.diff.outputs.classification }}\` |"
            echo "| catalog only (main..dev) | \`${{ steps.diff.outputs.catalog_only }}\` (informativ, ${{ steps.diff.outputs.changed_files }} Datei(en)) |"
            echo "| promote dev → main | \`${{ steps.dev_gate.outputs.promote }}\` |"
            echo "| version on main | \`${{ steps.decide.outputs.main_version }}\` |"
            echo "| deploy | \`${{ steps.decide.outputs.should_deploy }}\` |"
            echo "| release | \`${{ steps.decide.outputs.should_release }}\` |"
            echo "| changed by promotion | \`${{ steps.decide.outputs.changed_files }}\` |"
            echo "| force deploy | \`${{ inputs.force_deploy }}\` |"
            echo "| dry run | \`${{ inputs.dry_run }}\` |"
          } >> "$GITHUB_STEP_SUMMARY"

      # HINWEIS: Tag und Release werden hier bewusst NICHT erzeugt.
      # Sie sind in den `release`-Job verlagert, der erst nach dem erfolgreichen
      # Pages-Deploy läuft — ein fehlgeschlagener Deploy verbraucht also keine Version.

  deploy-pages:
    name: Build & deploy to GitHub Pages
    needs: promote
    # Gate 2: Deployt nur, wenn main durch den Merge vorgerückt ist oder
    # force_deploy einen Retry nach fehlgeschlagenem Deploy erzwingt.
    if: ${{ !inputs.dry_run && (needs.promote.outputs.should_deploy == 'true' || inputs.force_deploy) }}
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # WICHTIG: withastro/action checkt das Repository nicht selbst aus.
      # Es erwartet einen bereits ausgecheckten Baum; ohne diesen Checkout scheitert es
      # mit „No lockfile found", weil es ein leeres Verzeichnis untersucht.
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 #v4
        with:
          ref: main

      - name: Install, build, and upload your site
        uses: withastro/action@v3
        with:
          path: .
          node-version: 24
          package-manager: npm

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  release:
    name: Tag & release (after Pages deploy)
    needs: deploy-pages
    # Release nur bei echter Versionserhöhung — ein Katalog-Deploy ohne Bump
    # deployt Pages, erzeugt aber keinen Tag und kein Release.
    if: ${{ !inputs.dry_run && needs.promote.outputs.should_deploy == 'true' && needs.promote.outputs.should_release == 'true' }}
    runs-on: ubuntu-latest
    steps:
      # Verzögerter Tag und Release: läuft erst nach erfolgreichem deploy-pages, damit ein
      # fehlgeschlagener Deploy keine Versionsnummer verbraucht (Retry braucht keinen Bump).
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 #v4
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 #v4
        with:
          node-version: 24

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Read version from package.json
        id: version
        run: |
          VERSION=$(node -e "console.log(require('./package.json').version)")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"

      - name: Create git tag
        run: |
          TAG="${{ steps.version.outputs.tag }}"
          if git rev-parse "refs/tags/$TAG" >/dev/null 2>&1; then
            echo "⏭️ Tag $TAG already exists — skipping."
          else
            git tag -a "$TAG" -m "Release $TAG"
            git push origin "$TAG"
            echo "✅ Created and pushed tag $TAG"
          fi

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ steps.version.outputs.tag }}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "⏭️ Release $TAG already exists — skipping."
          else
            gh release create "$TAG" --title "$TAG" --generate-notes --latest
            echo "✅ Created GitHub release $TAG"
          fi
