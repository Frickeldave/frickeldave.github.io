apiVersion: apps/v1
kind: Deployment
metadata:
  name: database
  namespace: k8s-training
  labels:
    app: database
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: database
  template:
    metadata:
      labels:
        app: database
    spec:
      initContainers:
        - name: prepare-database-init
          image: busybox:1.36
          resources:
            requests:
              cpu: "50m"
              memory: "32Mi"
            limits:
              cpu: "100m"
              memory: "64Mi"
          command:
            - sh
            - -c
            - cp /source/10-health.sql /initdb/10-health.sql
          volumeMounts:
            - name: database-health-secret
              mountPath: /source
              readOnly: true
            - name: database-health-init
              mountPath: /initdb
      containers:
        - name: mariadb
          image: lscr.io/linuxserver/mariadb:latest
          resources:
            requests:
              cpu: "250m"
              memory: "256Mi"
            limits:
              cpu: "1000m"
              memory: "1Gi"
          ports:
            - name: mysql
              containerPort: 3306
              protocol: TCP
          envFrom:
            - configMapRef:
                name: database-config
          env:
            - name: MYSQL_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: database-secret
                  key: MYSQL_ROOT_PASSWORD
          volumeMounts:
            - name: database-config
              mountPath: /config
            - name: database-health-init
              mountPath: /config/initdb.d
      volumes:
        - name: database-config
          persistentVolumeClaim:
            claimName: mariadb-config
        - name: database-health-init
          emptyDir: {}
        - name: database-health-secret
          secret:
            secretName: database-secret
            items:
              - key: 10-health.sql
                path: 10-health.sql
