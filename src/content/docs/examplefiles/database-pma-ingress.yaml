apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: pma-ingress
  namespace: k8s-training
spec:
  ingressClassName: traefik
  rules:
  - host: pma.k8s-training.frickeldave.de
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: pma
            port:
              number: 80
