apiVersion: apps/v1
kind: Deployment
metadata:
  name: chromium
  namespace: k8s-training
  labels:
    app: chromium
spec:
  replicas: 1
  selector:
    matchLabels:
      app: chromium
  template:
    metadata:
      labels:
        app: chromium
    spec:
      containers:
        - name: chromium
          image: lscr.io/linuxserver/chromium:latest
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "1"
              memory: "1Gi"
          ports:
            - containerPort: 3000
            - containerPort: 3001
          envFrom:                          # PUID, PGID, TZ
            - configMapRef:
                name: linuxserver-common
          volumeMounts:
            - name: shm
              mountPath: /dev/shm
            - name: chromium-logs          # NEW: gemeinsames Log-Volume
              mountPath: /config/log
        - name: vector                     # NEW: Sidecar-Container
          image: timberio/vector:0.42.0-alpine
          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              cpu: "200m"
              memory: "128Mi"
          command:
            - vector
            - --config
            - /etc/vector/vector.toml
          volumeMounts:
            - name: chromium-logs          # NEW: gleiches Volume wie Chromium
              mountPath: /config/log
            - name: vector-config
              mountPath: /etc/vector
      volumes:
        - name: shm
          emptyDir:
            medium: Memory
            sizeLimit: 1Gi
        - name: chromium-logs              # NEW: shared emptyDir for logs
          emptyDir: {}
        - name: vector-config              # NEW: ConfigMap als Volume
          configMap:
            name: vector-config