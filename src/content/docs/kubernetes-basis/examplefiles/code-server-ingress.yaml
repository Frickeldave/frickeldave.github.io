apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: code-server-ingress
  namespace: k8s-training
spec:
  ingressClassName: nginx
  rules:
  - host: code.k8s-training.frickeldave.de
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: code-server
            port:
              number: 8443