apiVersion: apps/v1
kind: Deployment
metadata:
  name: github-actions-runner
  namespace: __NAMESPACE__
  labels:
    app.kubernetes.io/name: github-actions-runner
    app.kubernetes.io/part-of: frickeldave.github.io
spec:
  replicas: 2 # Each pod registers under a unique name (see RUNNER_NAME_PREFIX/POD_NAME below), so they run as independent parallel runners.
  selector:
    matchLabels:
      app.kubernetes.io/name: github-actions-runner
  template:
    metadata:
      labels:
        app.kubernetes.io/name: github-actions-runner
        app.kubernetes.io/part-of: frickeldave.github.io
    spec:
      imagePullSecrets:
        - name: ghcr-pull-secret
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        runAsGroup: 1001
        fsGroup: 1001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: github-runner
          image: __RUNNER_IMAGE__
          # The runner image uses a mutable tag (:latest). IfNotPresent would pin the node
          # to whatever it cached first, so a rebuilt image would never reach the pod.
          imagePullPolicy: Always
          env:
            - name: REPO_URL
              valueFrom:
                secretKeyRef:
                  name: github-runner-registration
                  key: REPO_URL
            - name: RUNNER_TOKEN
              valueFrom:
                secretKeyRef:
                  name: github-runner-registration
                  key: RUNNER_TOKEN
            # Base name only: the entrypoint combines it with POD_NAME (and
            # prepends this prefix only when the pod name lacks it) so replicas
            # don't register under the same runner identity and replace each
            # other.
            - name: RUNNER_NAME_PREFIX
              valueFrom:
                secretKeyRef:
                  name: github-runner-registration
                  key: RUNNER_NAME
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: RUNNER_SCOPE
              valueFrom:
                secretKeyRef:
                  name: github-runner-registration
                  key: RUNNER_SCOPE
            - name: RUNNER_LABELS
              valueFrom:
                secretKeyRef:
                  name: github-runner-registration
                  key: RUNNER_LABELS
            # Still required: a future fd-deploy.yaml calls `crane manifest`
            # inside this container to check whether a versioned image already
            # exists in GHCR, and GHCR packages need pull auth for that. Kaniko
            # itself never runs here - it runs in a throwaway Kubernetes Job
            # started by fd-deploy.yaml. Do not remove this mount as "leftover".
            - name: DOCKER_CONFIG
              value: /home/appuser/.registry-docker
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: false
          resources:
            requests:
              cpu: 100m
              memory: 512Mi
            limits:
              cpu: 1000m
              memory: 2Gi
          volumeMounts:
            - name: ghcr-registry-config
              mountPath: /home/appuser/.registry-docker
              readOnly: true
      volumes:
        - name: ghcr-registry-config
          secret:
            secretName: ghcr-pull-secret
            defaultMode: 0440
            items:
              - key: .dockerconfigjson
                path: config.json
      restartPolicy: Always
