# Template placeholders use the double-underscore NAME convention and must be
# substituted by scripts/bootstrap/bootstrap.mjs before kubectl apply.
# Never commit real secret values.
apiVersion: v1
kind: Secret
metadata:
  name: github-runner-registration
  namespace: __NAMESPACE__
type: Opaque
stringData:
  REPO_URL: |-
    __REPO_URL__
  RUNNER_TOKEN: |-
    __RUNNER_TOKEN__
  RUNNER_NAME: |-
    __RUNNER_NAME__
  RUNNER_SCOPE: |-
    __RUNNER_SCOPE__
  RUNNER_LABELS: |-
    __RUNNER_LABELS__
---
apiVersion: v1
kind: Secret
metadata:
  name: ghcr-pull-secret
  namespace: __NAMESPACE__
type: kubernetes.io/dockerconfigjson
stringData:
  .dockerconfigjson: |-
    __DOCKERCONFIGJSON__
